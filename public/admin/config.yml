backend:
  name: github
  repo: maxwellvolz/intervolzdotcom
  branch: master
  base_url: https://decap-oauth-brown.vercel.app
  auth_endpoint: api/auth

media_folder: 'public/uploads'
public_folder: '/uploads'

collections:
  - name: 'posts'
    label: 'Posts'
    folder: 'content/posts'
    create: true
    slug: '{{slug}}'
    extension: 'mdx'
    format: 'frontmatter'
    fields:
      - { name: 'title', label: 'Title', widget: 'string' }
      - { name: 'date', label: 'Date', widget: 'datetime' }

      - label: 'Description'
        name: 'description'
        widget: 'text'
        required: false
        hint: 'Meta description for search + social cards. 150-160 characters, one sentence, no throat-clearing.'

      - label: 'Cover Image'
        name: 'cover'
        widget: 'image'
        required: false
        hint: 'Optional cover image for blog index'

      - { name: 'technical', label: 'Technical', widget: 'boolean', default: false, required: false }
      - { name: 'draft', label: 'Draft', widget: 'boolean', default: false, required: false }
      - { name: 'work', label: 'Work', widget: 'boolean', default: false, required: false }
      - { name: 'pinned', label: 'Pinned', widget: 'boolean', default: false, required: false }
      - { name: 'devlog', label: 'Devlog', widget: 'boolean', default: false, required: false }
      - { label: 'Tags',name: 'tags',widget: 'string' }

      - { name: 'body', label: 'Body', widget: 'markdown' }

  # The reading list. One file, edited in place; the build fills in titles.
  # Category options mirror CATEGORY_FAMILY in lib/bookshelf.ts (this file
  # cannot import it, so add new ones in both places).
  - name: 'bookshelf'
    label: 'Bookshelf'
    files:
      - name: 'bookshelf'
        label: 'Bookshelf'
        file: 'content/bookshelf.yml'
        fields:
          - label: 'Items'
            name: 'items'
            widget: 'list'
            summary: '{{fields.title}} {{fields.url}}'
            collapsed: true
            fields:
              - { name: 'url', label: 'URL', widget: 'string', hint: 'Paste the link. That is the only required field.' }
              - { name: 'note', label: 'Note', widget: 'text', required: false, hint: 'One line, your review.' }
              - label: 'Category'
                name: 'category'
                widget: 'select'
                required: false
                hint: 'Sets the spine colour. Same names as post tags.'
                options:
                  - 'web'
                  - 'automation'
                  - 'fastapi'
                  - 'backend'
                  - 'howto'
                  - 'blog'
                  - 'react'
                  - 'threeJS'
                  - 'dataviz'
                  - 'docker'
                  - 'windows'
                  - 'CI/CD'
                  - 'ai'
                  - 'llm'
                  - 'ml'
                  - 'arvr'
                  - '@meta'
                  - 'python'
                  - 'javascript'
                  - 'rust'
                  - 'swift'
                  - 'blender'
                  - 'art'
                  - 'rant'
                  - 'n8n'
                  - 'unity'
              - { name: 'added', label: 'Added', widget: 'datetime', required: false, format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false, hint: 'Defaults to today.' }
              - { name: 'title', label: 'Title', widget: 'string', required: false, hint: 'Leave blank, the build fills it in.' }
              - { name: 'author', label: 'Author', widget: 'string', required: false }
