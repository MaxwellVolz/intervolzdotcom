<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="'Roboto Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace">
  <rect width="1200" height="630" fill="#0d1117"/>
  <!-- terminal window -->
  <rect x="48" y="48" width="1104" height="534" rx="18" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- title bar -->
  <circle cx="92" cy="92" r="9" fill="#ff5f56"/>
  <circle cx="122" cy="92" r="9" fill="#ffbd2e"/>
  <circle cx="152" cy="92" r="9" fill="#34d399"/>
  <text x="600" y="100" text-anchor="middle" font-size="22" fill="#6e7681">developing-slashwork.mdx</text>
  <line x1="48" y1="132" x2="1152" y2="132" stroke="#30363d" stroke-width="1.5"/>

  <!-- subtle exchange glyph -->
  <g opacity="0.14" fill="#34d399" stroke="#34d399" stroke-width="7">
    <line x1="955" y1="280" x2="1055" y2="280"/>
    <polygon points="1055,270 1055,290 1080,280" stroke="none"/>
    <line x1="1080" y1="314" x2="980" y2="314"/>
    <polygon points="980,304 980,324 955,314" stroke="none"/>
  </g>

  <!-- wordmark -->
  <text x="96" y="300" font-size="100" font-weight="700" fill="#34d399">&gt;</text>
  <text x="170" y="300" font-size="100" font-weight="700" fill="#e6edf3">slashwork</text>
  <line x1="170" y1="330" x2="710" y2="330" stroke="#34d399" stroke-width="6"/>
  <text x="170" y="392" font-size="40" fill="#8b949e">the arena I deleted</text>

  <!-- the pivot -->
  <text x="170" y="492" font-size="46" fill="#6e7681">arena</text>
  <line x1="166" y1="476" x2="316" y2="476" stroke="#6e7681" stroke-width="3"/>
  <line x1="346" y1="476" x2="404" y2="476" stroke="#8b949e" stroke-width="3"/>
  <polygon points="404,469 404,483 420,476" fill="#8b949e"/>
  <text x="440" y="492" font-size="46" fill="#34d399">offload network</text>

  <!-- footer -->
  <text x="170" y="548" font-size="28" fill="#6e7681">/work   /earn</text>
  <text x="1104" y="548" text-anchor="end" font-size="26" fill="#6e7681">slashwork.sh</text>
</svg>
